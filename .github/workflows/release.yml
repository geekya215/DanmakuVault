name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="dv-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "${name}.tar.gz" -C "target/${{ matrix.target }}/release" dv
          ls -l "${name}.tar.gz"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "dv-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/dv.exe" -DestinationPath "$name.zip"
          Get-ChildItem "$name.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: dv-${{ matrix.target }}
          path: |
            dv-*.tar.gz
            dv-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # nullglob: do not fail when one of the suffixes produced nothing
          shopt -s nullglob
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
