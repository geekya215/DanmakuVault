[workspace]
resolver = "2"
members = ["crates/dv-core", "crates/dv-store", "crates/dv-bili", "crates/dv-export", "crates/dv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/geekya215/DanmakuVault"

[workspace.dependencies]
dv-bili = { path = "crates/dv-bili" }
dv-core = { path = "crates/dv-core" }
dv-export = { path = "crates/dv-export" }
dv-store = { path = "crates/dv-store" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
flate2 = "1"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MSVC 14.44 fails with D8050 ("cannot execute c1.dll") when compiling C sources with /Z7.
# C code in dependencies (sqlite3, ring) needs no debug info, so disable it for dependencies only.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
